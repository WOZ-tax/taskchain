<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AI年末調整 イメージ動画</title>
<style>
@font-face{font-family:MPR;src:url(fonts/mpr-500.woff) format('woff');font-weight:500}
@font-face{font-family:MPR;src:url(fonts/mpr-800.woff) format('woff');font-weight:800}
@font-face{font-family:MPR;src:url(fonts/mpr-900.woff) format('woff');font-weight:900}
:root{--ink:#4A3B5C;--pink:#FF5FA2;--pink2:#FF8DC0;--mint:#3CCFAE;--mint2:#7FE0C8;--yellow:#FFD95A;--lav:#B8A6FF;--sky:#8FD3FF;--orange:#FFA36C;--gray:#8A7C9C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:MPR,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.emo{font-family:'Noto Color Emoji',sans-serif;font-weight:400}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#world{position:absolute;inset:0}
.layer{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;left:0;top:0}
.shadow{box-shadow:0 12px 0 rgba(74,59,92,.18)}

/* backgrounds */
#dull{background:#E8E5F2;background-image:radial-gradient(circle,#fff 5px,transparent 6px);background-size:64px 64px}
#bright{background:#FFF4E4;background-image:radial-gradient(circle,#FFDCEB 6px,transparent 7px);background-size:72px 72px}
.blob{border-radius:50%}

/* scene 1 */
.caption{background:#fff;border:6px solid var(--ink);border-radius:999px;padding:20px 60px 26px;font-weight:900;font-size:78px;white-space:nowrap}
.caption .blue{color:#6F8FD8}
.paper{width:250px;height:330px;background:#fff;border:5px solid var(--ink);border-radius:20px;overflow:hidden}
.paper .ph{height:84px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:25px;border-bottom:5px solid var(--ink);padding:0 10px;text-align:center;line-height:1.2}
.paper .pl{height:14px;border-radius:7px;background:#E7E2F0;margin:20px 22px 0}
.paper .pl.s{width:50%}
.paper .seal{position:absolute;right:18px;bottom:16px;width:56px;height:56px;border:4px solid #FF6B8B;border-radius:50%;color:#FF6B8B;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center}

/* scene 2 */
#bubble{background:var(--pink);color:#fff;border:7px solid var(--ink);border-radius:64px;padding:22px 62px 30px;font-size:88px;font-weight:900;white-space:nowrap}
#bubble svg{position:absolute;left:70px;top:100%;overflow:visible}

/* scene 3: phone */
#phone{width:480px;height:960px;background:var(--ink);border-radius:78px;padding:18px}
.screen{position:relative;width:444px;height:924px;background:#fff;border-radius:60px;overflow:hidden}
.appbar{position:absolute;left:0;top:0;width:100%;height:150px;background:linear-gradient(120deg,#FF7EB6,#FFA36C)}
.notch{position:absolute;left:157px;top:14px;width:130px;height:34px;background:var(--ink);border-radius:20px}
.sb-time{position:absolute;left:44px;top:15px;color:#fff;font-weight:800;font-size:22px}
.ab-row{position:absolute;left:22px;right:22px;top:62px;height:76px;display:flex;align-items:center;gap:14px}
.ab-icon{width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid var(--ink);overflow:hidden;flex:none;position:relative}
.ab-icon svg{position:absolute;left:-2px;top:6px;width:72px;height:87px}
.ab-title{color:#fff;font-weight:900;font-size:36px;flex:1;text-shadow:0 3px 0 rgba(74,59,92,.25);white-space:nowrap}
.steps{display:flex;gap:8px}
.st{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.4);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.st.on{background:#fff;color:var(--pink)}
.panels{position:absolute;left:0;top:150px;width:444px;height:774px;overflow:hidden}
.panel{position:absolute;left:0;top:0;width:444px;height:774px}
.ptitle{position:absolute;left:0;right:0;top:24px;text-align:center;font-weight:900;font-size:32px;white-space:nowrap}
.vf{position:absolute;left:42px;top:86px;width:360px;height:470px;background:#F1ECFA;border-radius:30px;overflow:hidden}
.cn{position:absolute;width:58px;height:58px;border:0 solid var(--pink)}
.cn.tl{left:14px;top:14px;border-top-width:9px;border-left-width:9px;border-top-left-radius:22px}
.cn.tr{right:14px;top:14px;border-top-width:9px;border-right-width:9px;border-top-right-radius:22px}
.cn.bl{left:14px;bottom:14px;border-bottom-width:9px;border-left-width:9px;border-bottom-left-radius:22px}
.cn.br{right:14px;bottom:14px;border-bottom-width:9px;border-right-width:9px;border-bottom-right-radius:22px}
.doc{position:absolute;left:50px;top:52px;width:260px;height:366px;background:#fff;border:4px solid var(--ink);border-radius:16px;transform:rotate(-3deg)}
.doc-h{background:var(--mint2);border-bottom:4px solid var(--ink);border-radius:12px 12px 0 0;font-weight:900;font-size:19px;text-align:center;padding:12px 4px;white-space:nowrap}
.doc-row{position:relative;margin:20px 18px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:800;color:var(--gray)}
.doc-row b{font-size:23px;color:var(--ink);font-weight:900}
.doc-line{height:10px;background:#E7E2F0;border-radius:5px;margin:18px 18px 0}
.doc-line.s{width:45%}
.doc-seal{position:absolute;right:16px;bottom:14px;width:48px;height:48px;border:4px solid #FF6B8B;border-radius:50%;color:#FF6B8B;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.det{position:absolute;left:-10px;right:-10px;top:-9px;bottom:-9px;border:4px solid var(--pink);border-radius:12px;background:rgba(255,95,162,.10);opacity:0}
#scanline{left:0;width:360px;height:12px;background:linear-gradient(90deg,transparent,#3CCFAE 15%,#3CCFAE 85%,transparent);box-shadow:0 0 28px 10px rgba(60,207,174,.55)}
#scanStatusWrap{position:absolute;left:0;right:0;top:578px;display:flex;justify-content:center}
.pill{background:#F1ECFA;border-radius:999px;padding:8px 26px 10px;font-weight:900;font-size:26px;white-space:nowrap}
.pill.ok{background:#DDF8F0;color:#1FA987}
#shutter{width:92px;height:92px;border-radius:50%;background:#fff;border:9px solid var(--pink);box-shadow:0 0 0 5px var(--ink)}
.row{position:absolute;left:20px;width:404px;height:100px;background:#F8F4FF;border:4px solid #E5DDF5;border-radius:24px}
.row .lb{position:absolute;left:24px;top:10px;font-size:21px;font-weight:800;color:var(--gray);white-space:nowrap}
.row .val{position:absolute;left:24px;top:38px;font-size:36px;font-weight:900;white-space:nowrap}
.row .val i{font-style:normal;color:var(--pink)}
.row .ck{position:absolute;right:20px;top:20px;width:54px;height:54px;border-radius:50%;background:var(--mint);border:4px solid var(--ink)}
.row .ck svg{position:absolute;left:7px;top:8px}
#submit{width:340px;height:86px;border-radius:43px;background:#CFC6DD;color:#fff;font-weight:900;font-size:38px;display:flex;align-items:center;justify-content:center;border:5px solid var(--ink);overflow:hidden}
#submit.on{background:var(--pink)}
#ripple{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.75)}
#pC{position:absolute;inset:0;pointer-events:none}
#pCveil{position:absolute;inset:0;background:#fff}
#stamp{width:300px;height:300px;border-radius:50%;border:12px solid #FF4D8D;color:#FF4D8D;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 7px #fff,inset 0 0 0 11px #FF4D8D}
#stamp .s1{font-size:32px;font-weight:900;white-space:nowrap}
#stamp .s2{font-size:100px;font-weight:900;line-height:1.05}
#stamp .s3{font-size:30px;font-weight:900;white-space:nowrap}
.rdot{width:22px;height:22px;border-radius:50%}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#finger{font-size:140px;line-height:1}

.feat{width:660px;height:176px;background:#fff;border:6px solid var(--ink);border-radius:46px;display:flex;align-items:center;gap:26px;padding:0 30px}
.feat .ic{width:118px;height:118px;border-radius:50%;border:5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:62px;flex:none}
.feat .tag{font-weight:900;font-size:24px;letter-spacing:.14em}
.feat .ti{font-weight:900;font-size:47px;line-height:1.18;white-space:nowrap}
.feat .sub{font-weight:800;font-size:26px;color:var(--gray);white-space:nowrap}

/* scene 4 */
#title4{display:flex;white-space:nowrap}
.tchar{display:inline-block;font-weight:900;font-size:150px;line-height:1.1}
.badge{width:720px;height:156px;background:#fff;border:6px solid var(--ink);border-radius:78px;display:flex;align-items:center;justify-content:center;gap:22px;padding:0 36px}
.badge .bi{font-size:78px}
.badge .bt{font-size:48px;font-weight:900;white-space:nowrap}
.badge .big{font-size:88px;color:var(--pink)}
.badge .big.m{color:var(--mint)}
.conf{left:0;top:0}

/* scene 5 */
#end{background:#FFB8D6;background-image:radial-gradient(circle,rgba(255,255,255,.55) 7px,transparent 8px);background-size:80px 80px}
#logo{display:flex;white-space:nowrap}
.lchar{display:inline-block;font-weight:900;font-size:210px;line-height:1.1;color:#fff}
.lchar.ai{color:#FFE45C}
#tagline{background:#fff;border:6px solid var(--ink);border-radius:999px;padding:18px 60px 26px;font-size:60px;font-weight:900;white-space:nowrap}
#tagline b{color:var(--pink);font-weight:900}
</style>
</head>
<body>
<div id="stage"><div id="world">
  <div id="dull" class="layer"></div>

  <div id="s1" class="layer">
    <div id="person1" class="abs" style="width:300px;height:375px"></div>
  </div>

  <div id="bright" class="layer"></div>

  <div id="confBack" class="layer"></div>
  <div id="papers" class="layer"></div>
  <div id="capLayer" class="layer">
    <div id="cap" class="abs caption shadow">年末調整って、<span class="blue">めんどう…</span><span class="emo">💦</span></div>
  </div>

  <div id="s3" class="layer">
    <div id="phone" class="abs shadow">
      <div class="screen">
        <div class="appbar">
          <div class="notch"></div>
          <div class="sb-time">9:41</div>
          <div class="ab-row">
            <div class="ab-icon" id="abIcon"></div>
            <div class="ab-title">AI年末調整</div>
            <div class="steps"><span class="st">1</span><span class="st">2</span><span class="st">3</span></div>
          </div>
        </div>
        <div class="panels">
          <div id="pA" class="panel">
            <div class="ptitle"><span class="emo">📸</span> 書類をスキャン</div>
            <div class="vf">
              <div class="doc">
                <div class="doc-h">生命保険料控除証明書</div>
                <div class="doc-row"><span>契約者</span><b>山田 花子</b><div class="det" id="det1"></div></div>
                <div class="doc-line"></div><div class="doc-line s"></div>
                <div class="doc-row"><span>証明額</span><b>¥120,000</b><div class="det" id="det2"></div></div>
                <div class="doc-line"></div><div class="doc-line"></div><div class="doc-line s"></div>
                <div class="doc-seal">印</div>
              </div>
              <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
              <div id="scanline" class="abs"></div>
            </div>
            <div id="scanStatusWrap"><div id="scanStatus" class="pill"></div></div>
            <div id="shutter" class="abs"></div>
          </div>
          <div id="pB" class="panel">
            <div class="ptitle" id="pBtitle"></div>
            <div id="rows"></div>
            <div id="submit" class="abs">提出する<div id="ripple" class="abs"></div></div>
          </div>
          <div id="pC">
            <div id="pCveil"></div>
            <div id="rdots"></div>
            <div id="stamp" class="abs"><div class="s1">AIチェック</div><div class="s2">OK!</div><div class="s3">ミス 0件</div></div>
          </div>
          <div id="flash"></div>
        </div>
      </div>
    </div>
    <div id="feats"></div>
    <div id="finger" class="abs emo">👆</div>
  </div>

  <div id="s4" class="layer">
    <div id="title4" class="abs"></div>
    <div id="badge1" class="abs badge shadow"><span class="bi emo">⏱️</span><span class="bt">たった <span class="big">3分</span> で完了！</span></div>
    <div id="badge2" class="abs badge shadow"><span class="bi emo">✅</span><span class="bt">ミス・差し戻し <span class="big m">0件</span></span></div>
    <div id="person2" class="abs" style="width:300px;height:375px"></div>
  </div>

  <div id="robotWrap" class="abs" style="width:400px;height:483px"></div>
  <div id="sparks" class="layer"></div>
  <div id="bubble" class="abs shadow">AIに おまかせ！<svg width="80" height="70"><path d="M2 -2 L66 -2 L12 60 Z" fill="#FF5FA2"/><path d="M2 3 L12 60 L66 3" fill="none" stroke="#4A3B5C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
  <div id="confetti" class="layer"></div>

  <div id="end" class="layer">
    <div id="endSparks"></div>
    <div id="robot2Wrap" class="abs" style="width:400px;height:483px"></div>
    <div id="logo" class="abs"></div>
    <div id="tagline" class="abs shadow">年末調整は、ぜんぶ<b>AIにおまかせ</b>。</div>
  </div>
</div></div>

<script>
// ---------- helpers ----------
const INK = '#4A3B5C';
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inBack: x => { const c1 = 1.7, c3 = c1 + 1; return c3 * x * x * x - c1 * x * x; },
  outElastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
  outBounce: x => { const n1 = 7.5625, d1 = 2.75;
    if (x < 1 / d1) return n1 * x * x;
    if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + .75;
    if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + .9375;
    return n1 * (x -= 2.625 / d1) * x + .984375; },
};
function tf(el, { x = 0, y = 0, s = 1, sx = null, sy = null, r = 0, o = null }) {
  el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`;
  if (o !== null) el.style.opacity = o;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function outline(r, color, drop = true) {
  const s = [];
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; s.push(`${(Math.cos(a) * r).toFixed(1)}px ${(Math.sin(a) * r).toFixed(1)}px 0 ${color}`); }
  if (drop) for (let k = 1; k <= 3; k++) s.push(`0 ${r + k * 3}px 0 ${color}`);
  return s.join(',');
}
const pop = (t, t0, d = .38) => t < t0 ? 0 : E.outBack(prog(t, t0, t0 + d));
const popOut = (t, t0, d = .22) => 1 - E.inBack(prog(t, t0, t0 + d));
const sparkPath = 'M0 -50 C 6 -12 12 -6 50 0 C 12 6 6 12 0 50 C -6 12 -12 6 -50 0 C -12 -6 -6 -12 0 -50Z';

// ---------- characters ----------
function robotSVG() {
  const S = `stroke="${INK}" stroke-width="6"`;
  return `<svg viewBox="0 0 240 290" width="100%" height="100%" overflow="visible">
  <ellipse cx="94" cy="272" rx="22" ry="13" fill="#B8A6FF" ${S}/>
  <ellipse cx="146" cy="272" rx="22" ry="13" fill="#B8A6FF" ${S}/>
  <g class="rb-armL"><rect x="66" y="194" width="24" height="60" rx="12" fill="#7FE0C8" ${S}/><circle cx="78" cy="258" r="16" fill="#fff" ${S}/></g>
  <g class="rb-armR"><rect x="150" y="194" width="24" height="60" rx="12" fill="#7FE0C8" ${S}/><circle cx="162" cy="258" r="16" fill="#fff" ${S}/></g>
  <rect x="74" y="176" width="92" height="88" rx="34" fill="#7FE0C8" ${S}/>
  <path d="M120 240 C 103 228 98 214 108 207 C 114 203 119 206 120 211 C 121 206 126 203 132 207 C 142 214 137 228 120 240Z" fill="#FF5FA2" stroke="${INK}" stroke-width="4"/>
  <g class="rb-head">
    <line x1="120" y1="46" x2="120" y2="20" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
    <g class="rb-bulb"><circle cx="120" cy="14" r="13" fill="#FFD95A" stroke="${INK}" stroke-width="5"/></g>
    <rect x="6" y="94" width="28" height="58" rx="14" fill="#FFB3D1" ${S}/>
    <rect x="206" y="94" width="28" height="58" rx="14" fill="#FFB3D1" ${S}/>
    <rect x="24" y="42" width="192" height="148" rx="66" fill="#fff" ${S}/>
    <rect x="46" y="66" width="148" height="100" rx="46" fill="#3D3360"/>
    <path d="M66 90 q8 -12 24 -14" stroke="#fff" stroke-opacity=".3" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g class="rb-eyes"><rect x="84" y="94" width="22" height="36" rx="11" fill="#7FF5E0"/><rect x="134" y="94" width="22" height="36" rx="11" fill="#7FF5E0"/></g>
    <g class="rb-happy" opacity="0" stroke="#7FF5E0" stroke-width="9" fill="none" stroke-linecap="round"><path d="M80 122 q15 -24 30 0"/><path d="M130 122 q15 -24 30 0"/></g>
    <path class="rb-mouth" d="M108 142 q12 10 24 0" stroke="#7FF5E0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse class="rb-mouthO" cx="120" cy="146" rx="13" ry="10" fill="#7FF5E0" opacity="0"/>
    <ellipse cx="68" cy="146" rx="12" ry="7" fill="#FF7EB6" opacity=".9"/>
    <ellipse cx="172" cy="146" rx="12" ry="7" fill="#FF7EB6" opacity=".9"/>
  </g>
</svg>`;
}
function makeRobot(el) {
  el.innerHTML = robotSVG();
  const q = c => el.querySelector(c);
  return { el, armL: q('.rb-armL'), armR: q('.rb-armR'), head: q('.rb-head'), bulb: q('.rb-bulb'),
    eyes: q('.rb-eyes'), happy: q('.rb-happy'), mouth: q('.rb-mouth'), mouthO: q('.rb-mouthO') };
}
function poseRobot(r, { armL = 8, armR = -8, blink = 1, happy = 0, mouthO = 0, headY = 0, bulb = 1 }) {
  r.armL.setAttribute('transform', `rotate(${armL} 78 200)`);
  r.armR.setAttribute('transform', `rotate(${armR} 162 200)`);
  r.head.setAttribute('transform', `translate(0 ${headY})`);
  r.bulb.setAttribute('transform', `translate(120 14) scale(${bulb}) translate(-120 -14)`);
  r.eyes.setAttribute('transform', `translate(0 112) scale(1 ${Math.max(.08, blink)}) translate(0 -112)`);
  r.eyes.setAttribute('opacity', 1 - happy);
  r.happy.setAttribute('opacity', happy);
  r.mouth.setAttribute('opacity', 1 - mouthO);
  r.mouthO.setAttribute('opacity', mouthO);
}
const blinkAt = (t, times) => { let b = 1; for (const bt of times) { const d = Math.abs(t - bt); if (d < .09) b = Math.min(b, d / .09); } return b; };

function personSVG(mood) {
  const S = `stroke="${INK}" stroke-width="6"`;
  const happy = mood === 'happy';
  const arms = happy
    ? `<g class="pa-L"><rect x="56" y="200" width="28" height="70" rx="14" fill="#FFE0C7" ${S}/></g><g class="pa-R"><rect x="156" y="200" width="28" height="70" rx="14" fill="#FFE0C7" ${S}/></g>`
    : `<g class="pa-L"><rect x="58" y="206" width="26" height="62" rx="13" fill="#FFE0C7" ${S}/></g><g class="pa-R"><rect x="156" y="206" width="26" height="62" rx="13" fill="#FFE0C7" ${S}/></g>`;
  const face = happy
    ? `<g stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"><path d="M78 128 q14 -18 28 0"/><path d="M134 128 q14 -18 28 0"/></g>
       <path d="M98 150 q22 34 44 0 Z" fill="${INK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
       <path d="M108 162 q12 -8 24 0 q-12 10 -24 0Z" fill="#FF7EB6"/>
       <ellipse cx="72" cy="152" rx="13" ry="8" fill="#FF9EBF"/><ellipse cx="168" cy="152" rx="13" ry="8" fill="#FF9EBF"/>`
    : `<g stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M80 116 l20 10 l-20 10"/><path d="M160 116 l-20 10 l20 10"/></g>

  person1.sweat.setAttribute('opacity', 1 - ((t * 1.6) % 1) * .6);

  person1.armL.setAttribute('transform', `rotate(${12 + Math.sin(t * 14) * 4} 70 210)`);
  person1.armR.setAttribute('transform', `rotate(${-12 - Math.sin(t * 14) * 4} 170 210)`);

    const f = prog(t, t0, t0 + .45);
    let x = p.x, y = lerp(-240, p.y, E.outBounce(f)), r = lerp(p.r + (i % 2 ? 45 : -45), p.r, E.outCubic(f)), s = 1, o = 1;
    x += Math.sin(t * 55 + i * 2) * 3 * prog(t, 1.2, 1.4);
    const ts = 2.32 + i * .07, q = E.inOutCubic(prog(t, ts, ts + .4));
    if (q > 0) {
      const P0 = { x, y }, P2 = { x: 960, y: 610 }, P1 = { x: (x + 960) / 2 + 120, y: Math.min(y, 610) - 320 };
      x = (1 - q) * (1 - q) * P0.x + 2 * (1 - q) * q * P1.x + q * q * P2.x;
      y = (1 - q) * (1 - q) * P0.y + 2 * (1 - q) * q * P1.y + q * q * P2.y;

  // ---- robot (scenes 2-4) ----
  let rx = 960, ry = 600, rs = 0, rr = 0, ro = 0;

  if (t >= 2.0) {

    rs = E.outElastic(a) * (t < 3.3 ? 1 : 1);
    rr = Math.sin((t - 2) * 18) * 8 * Math.max(0, 1 - (t - 2) / .6);

  t4chars.forEach((el, i) => {
    const t0 = 7.08 + i * .05, k = t < t0 ? 0 : E.outBack(prog(t, t0, t0 + .36));
    const wave = t > t0 + .36 ? Math.sin((t - t0) * 7) * 10 : 0;
    el.style.transform = `translateY(${(1 - k) * 80 + wave}px) scale(${k}) rotate(${(i % 2 ? 6 : -6) * (1 - k)}deg)`;
  });
  tf($('#title4'), { x: 960, y: 245, o: t > 7.0 && t < 8.8 ? 1 : 0 });
  const b1 = pop(t, 7.42, .38), b2 = pop(t, 7.58, .38);
  tf($('#badge1'), { x: 960, y: 590 + Math.sin(t * 4) * 4, s: b1, r: -2, o: b1 > 0 ? 1 : 0 });
  tf($('#badge2'), { x: 960, y: 790 + Math.sin(t * 4 + 1) * 4, s: b2, r: 2, o: b2 > 0 ? 1 : 0 });
  const p2s = pop(t, 7.12, .4), pj = t > 7.5 ? Math.abs(Math.sin((t - 7.5) * Math.PI * 2.4)) * 60 : 0;
  tf(person2.el, { x: 340, y: 720 - pj, s: p2s, r: Math.sin(t * 8 + 1) * 4, o: p2s > 0 ? 1 : 0 });
  person2.armL.setAttribute('transform', `rotate(${150 + Math.sin(t * 16) * 14} 70 210)`);
  person2.armR.setAttribute('transform', `rotate(${-150 - Math.sin(t * 16) * 14} 170 210)`);

  // confetti
  confetti.forEach(c => {
    const tau = t - 7.02 - c.delay;
    if (tau <= 0 || t > 8.8) { c.el.style.opacity = 0; return; }
    const k = 2.2, g = 1100, ek = (1 - Math.exp(-k * tau)) / k;
    const x = c.x0 + c.vx * ek + Math.sin(tau * 7 + c.ph) * 26 * Math.min(1, tau);
    const y = c.y0 + (g / k) * tau + (c.vy - g / k) * ek;
    c.el.style.opacity = 1;
    c.el.style.transform = `translate(${x}px,${y}px) rotate(${c.spin * tau + c.ph * 57}deg) scaleY(${Math.cos(tau * c.flip + c.ph)})`;
  });

  // ---- scene 5 (end card) ----
  const w2 = E.inOutCubic(prog(t, 8.42, 8.78));
  $('#end').style.clipPath = `circle(${w2 * 1250}px at 960px 540px)`;
  $('#end').style.backgroundPosition = `${t * 30}px ${-t * 30}px`;
  const r2s = pop(t, 8.6, .45);
  tf(robot2.el, { x: 960, y: 300 + Math.sin(t * 5) * 8, s: r2s * .62, o: r2s > 0 ? 1 : 0 });
  poseRobot(robot2, { happy: 1, armL: 10, armR: -135 + Math.sin(t * 14) * 25, mouthO: 1, bulb: 1 + .15 * Math.sin(t * 10), headY: Math.sin(t * 6) * 2 });
  lchars.forEach((el, i) => {
    const t0 = 8.72 + i * .055, k = t < t0 ? 0 : E.outBack(prog(t, t0, t0 + .38));
    const wave = t > t0 + .38 ? Math.sin((t - t0) * 5) * 6 : 0;
    el.style.transform = `translateY(${(1 - k) * 90 + wave}px) scale(${k})`;
  });
  tf($('#logo'), { x: 960, y: 610 });
  const tgs = pop(t, 9.12, .4);
  tf($('#tagline'), { x: 960, y: 850, s: tgs, o: tgs > 0 ? 1 : 0 });
  endSparks.forEach(s => {
    const k = t < 8.85 ? 0 : 1;
    const tw = (.6 + .4 * Math.sin((t - 8.85) * 7 + s.ph)) * E.outBack(prog(t, 8.85 + s.ph * .08, 9.2 + s.ph * .08));
    tf(s.el, { x: s.x, y: s.y + Math.sin(t * 3 + s.ph) * 10, s: s.s * tw, r: t * 60 + s.ph * 40, o: k });
  });
}
window.render = render;
window.DURATION = 10;

// preview mode: open the HTML in a browser to watch it loop
if (!/[?&]render/.test(location.search)) {
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % 10.5); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
